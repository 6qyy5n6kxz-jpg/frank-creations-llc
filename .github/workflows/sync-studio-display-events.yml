name: Sync Studio Display Events

on:
  workflow_dispatch:
  schedule:
    # Four refreshes per day are enough for an upcoming-events display. The
    # display itself re-fetches the latest published snapshot every five minutes.
    - cron: "17 */6 * * *"

# A manual run and a scheduled run must not publish competing branch updates.
concurrency:
  group: studio-display-event-sync
  cancel-in-progress: false

jobs:
  sync-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh studio display event snapshot
        run: python3 scripts/sync-studio-display-events.py --output "$RUNNER_TEMP/studio-display-events.json"

      - name: Publish snapshot to studio-display-sync
        env:
          SNAPSHOT_PATH: ${{ runner.temp }}/studio-display-events.json
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Never commit generated snapshots to main. main is reserved for
          # deliberate website development, so automation publishes a small,
          # data-only history on studio-display-sync instead.
          if git fetch origin refs/heads/studio-display-sync:refs/remotes/origin/studio-display-sync; then
            git switch -C studio-display-sync refs/remotes/origin/studio-display-sync
          else
            git switch --orphan studio-display-sync
          fi

          mkdir -p data
          cp "$SNAPSHOT_PATH" data/studio-display-events.json
          git add data/studio-display-events.json

          if git diff --cached --quiet; then
            echo "No studio-display event changes."
            exit 0
          fi

          git commit -m "Sync studio-display events"
          git push origin HEAD:studio-display-sync
